<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Find your perfect date with EverUs!">

  <!-- Google Sign-In Web Client -->
  <meta name="google-signin-client_id" content="935315479839-f6rtlci4779ivfni4tm5hg1ko46uqa4r.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EverUs">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon & Touch Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=2"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=2"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2"/>

  <title>EverUs - Find Your Perfect Date</title>
  <link rel="manifest" href="manifest.json?v=2">

  <style>
    body {
      background-color: #FAF6FA;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #643753;
      transition: opacity 0.4s ease-out;
    }
    .heart-loader {
      font-size: 48px;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading-container">
    <div class="heart-loader">💖</div>
    <p style="font-weight: 600; margin-top: 16px;">EverUs is loading...</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
